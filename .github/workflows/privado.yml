name: Privado Scan
on: push
    
jobs:
  privado:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    env:
      PRIVADO_API_TOKEN: ${{ secrets.PRIVADO_API_TOKEN }}
      PRIVADO_API_ID: "604DA7E2800AFFE6A7AC8068"
      PRIVADO_API_HOST: "https://mobile-app-test.gcp.privado-dev.com"
      PRIVADO_CI_PLATFORM: "GITHUB_ACTIONS"
      PRIVADO_DOCKER_IMAGE: 638117407428.dkr.ecr.eu-west-1.amazonaws.com/scanner-agent:latest
      PRIVADO_REPOSITORY_ID: ${{ github.repository_id }}
      PRIVADO_REPOSITORY_NAME: ${{ github.repository }}
      PRIVADO_COMMIT_ID: ${{ github.sha }}
      PRIVADO_BRANCH_NAME: ${{ github.ref_name }}
      PRIVADO_DEFAULT_BRANCH_NAME: ${{ github.event.repository.default_branch }}
      PRIVADO_REPOSITORY_URL: ${{ github.repositoryUrl }}
      PRIVADO_MOBILE_APPLICATION_ID: "6e12dcb6-d32a-4581-b155-9760cb425a36"
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: "Debug ECR token (temporary)"
      continue-on-error: true
      run: |
        set +e
        TOKEN=$(curl --fail -s -H "Content-Type: application/json" -H "Authorization: Token $PRIVADO_API_TOKEN" -H "idt: $PRIVADO_API_TOKEN" -H "data-url: /ce/integrations/customers/$PRIVADO_API_ID/docker-registry-token" "$PRIVADO_API_HOST/ce/integrations/customers/$PRIVADO_API_ID/docker-registry-token?ci=true")
        echo "::add-mask::$TOKEN"
        echo "curl exit/length: $? / ${#TOKEN}"
        EXP=$(echo "$TOKEN" | base64 -d 2>/dev/null | jq -r '.expiration' 2>/dev/null)
        if [ -n "$EXP" ] && [ "$EXP" != "null" ]; then
          echo "token expiration: $(date -u -d @"$EXP")   now: $(date -u)"
        else
          echo "token is NOT a valid ECR token; first 30 chars: ${TOKEN:0:30}"
        fi
        for R in eu-west-1 ap-south-1 us-east-1; do
          if echo "$TOKEN" | docker login --username AWS --password-stdin 638117407428.dkr.ecr.$R.amazonaws.com >/dev/null 2>&1; then
            echo "LOGIN OK for region: $R"
          else
            echo "login failed for region: $R"
          fi
        done
        docker logout 638117407428.dkr.ecr.eu-west-1.amazonaws.com >/dev/null 2>&1
    - name: "Login to docker registry"
      run: |
        curl --fail -s -H "Content-Type: application/json" -H "Authorization: Token $PRIVADO_API_TOKEN" -H "idt: $PRIVADO_API_TOKEN" -H "data-url: /ce/integrations/customers/$PRIVADO_API_ID/docker-registry-token" $PRIVADO_API_HOST/ce/integrations/customers/$PRIVADO_API_ID/docker-registry-token?ci=true | docker login --username AWS --password-stdin $PRIVADO_DOCKER_IMAGE
    - name: Run Privado Scanner
      run: |
        env | grep "PRIVADO_" > $GITHUB_WORKSPACE/.privado.env
        docker run -t -v $GITHUB_WORKSPACE:/privado --env-file $GITHUB_WORKSPACE/.privado.env --pull=always $PRIVADO_DOCKER_IMAGE
